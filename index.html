<style>
  :root{
    --red:#e2231a;
    --red-dark:#a8180f;
    --ink:#1c1c1c;
    --paper:#ffffff;
    --line:#1c1c1c;
    --head-bg:#e7e7e7;
    --bg:#f0f2f5;
    --panel:#ffffff;
    --accent:#2b6cb0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
  }
  h1{
    font-size:18px;
    margin:0;
    color:#333;
  }

  /* ---- Control panel ---- */
  .panel{
    width:100%;
    max-width:520px;
    background:var(--panel);
    border-radius:14px;
    padding:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .panel label{
    font-size:13px;
    font-weight:600;
    color:#444;
    margin-bottom:4px;
    display:block;
  }
  .row-inline{
    display:flex;
    gap:10px;
    align-items:flex-end;
  }
  .row-inline > div{flex:1;}
  input[type="text"], input[type="number"], select{
    width:100%;
    padding:9px 10px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  .rows-editor{
    display:flex;
    flex-direction:column;
    gap:6px;
    max-height:320px;
    overflow-y:auto;
    padding-right:2px;
  }
  .row-item{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .row-item input{padding:7px 8px; font-size:13px;}
  .row-item .st-input{width:90px; flex:none;}
  .row-item .d-input{flex:1;}
  .del-btn{
    background:#f3f3f3;
    border:1px solid #ddd;
    color:#c0392b;
    border-radius:8px;
    width:32px;
    height:32px;
    flex:none;
    cursor:pointer;
    font-size:16px;
    line-height:1;
  }
  .del-btn:hover{background:#fbe4e4;}

  .btn{
    border:none;
    border-radius:9px;
    padding:10px 14px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:transform .05s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-add{
    background:#eef4ff;
    color:var(--accent);
    border:1px dashed #9db8e8;
  }
  .btn-add:hover{background:#e2ecff;}
  .btn-main{
    background:var(--red);
    color:#fff;
    width:100%;
    padding:13px;
    font-size:15px;
    box-shadow:0 3px 10px rgba(226,35,26,.35);
  }
  .btn-main:hover{background:var(--red-dark);}
  .btn-main:disabled{opacity:.6; cursor:default;}

  /* ---- Exportable card ---- */
  #card-wrapper{
    background:#ddd;
    padding:0;
  }
  #export-card{
    width:420px;
    background:var(--paper);
    padding:26px 24px 30px;
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    direction:ltr;
  }
  .card-title{
    text-align:center;
    font-size:30px;
    font-weight:800;
    color:#111;
    margin:0 0 16px;
    letter-spacing:.5px;
  }
  table.data-table{
    width:100%;
    border-collapse:collapse;
    border:1.5px solid var(--line);
  }
  table.data-table th{
    background:var(--head-bg);
    border:1.5px solid var(--line);
    padding:12px 8px;
    font-size:17px;
    font-weight:800;
    text-align:center;
  }
  table.data-table td{
    border:1.5px solid var(--line);
    padding:11px 8px;
    font-size:17px;
    text-align:center;
    color:#111;
  }
  table.data-table td.empty, table.data-table th.empty{
    color:#999;
    font-style:italic;
    font-size:14px;
  }
  .logo-area{
    display:flex;
    justify-content:flex-start;
    margin:26px 0 4px;
  }
  .logo-img{
    width:130px;
    height:auto;
    display:block;
  }

  .shift-mark{
    font-size:11px;
    color:#555;
    text-align:right;
    margin:2px 0 0;
    direction:rtl;
    unicode-bidi:isolate;
    font-family:Tahoma, Arial, sans-serif;
  }

  .developer-mark{font-size:10px;color:#c8c8c8;text-align:center;margin-top:8px;letter-spacing:.2px;}
  .hint{
    font-size:12px;
    color:#777;
    text-align:center;
    max-width:420px;
  }
  #status{
    font-size:13px;
    color:#2b6cb0;
    min-height:16px;
    text-align:center;
  }
</style>
</head>

<p class="hint">غيّر العنوان، أضف صفوف الستاند والقطر يدويًا، ثم اضغط "تحميل الصورة" للحصول على صورة جاهزة بنفس تصميم الجدول الأصلي مع شعار الشركة.</p>

<script>
let rows = [
  {st:'ST 1', d:'539.5'},
  {st:'ST 2', d:'538'},
  {st:'ST 3', d:'540'},
];
let idCounter = 0;
rows = rows.map(r => ({...r, id: idCounter++}));

const rowsEditor = document.getElementById('rowsEditor');
const cardTbody = document.getElementById('cardTbody');
const titleInput = document.getElementById('titleInput');
const cardTitle = document.getElementById('cardTitle');
const status = document.getElementById('status');
const shiftSelect = document.getElementById('shiftSelect');
const shiftMark = document.getElementById('shiftMark');

function renderEditor(){
  rowsEditor.innerHTML = '';
  rows.forEach(r => {
    const div = document.createElement('div');
    div.className = 'row-item';
    div.innerHTML = `
      <input type="text" class="st-input" value="${escapeHtml(r.st)}" data-id="${r.id}" data-field="st" placeholder="ST 1">
      <input type="text" class="d-input" value="${escapeHtml(r.d)}" data-id="${r.id}" data-field="d" placeholder="القطر D(mm)">
      <button class="del-btn" data-id="${r.id}" title="حذف">×</button>
    `;
    rowsEditor.appendChild(div);
  });
}

function renderCard(){
  cardTitle.textContent = titleInput.value.trim() || 'Rb';
  shiftMark.textContent = shiftSelect.value;
  cardTbody.innerHTML = '';
  rows.forEach(r => {
    const tr = document.createElement('tr');
    const stEmpty = !r.st.trim();
    const dEmpty = !r.d.trim();
    tr.innerHTML = `
      <td class="${stEmpty ? 'empty' : ''}">${escapeHtml(r.st) || '—'}</td>
      <td class="${dEmpty ? 'empty' : ''}">${escapeHtml(r.d) || '—'}</td>
    `;
    cardTbody.appendChild(tr);
  });
  if(rows.length === 0){
    cardTbody.innerHTML = `<tr><td colspan="2" class="empty">أضف صفوف من اللوحة أعلاه</td></tr>`;
  }
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[s]));
}

function renderAll(){
  renderEditor();
  renderCard();
}

rowsEditor.addEventListener('input', (e) => {
  const id = Number(e.target.dataset.id);
  const field = e.target.dataset.field;
  if(!field) return;
  const row = rows.find(r => r.id === id);
  if(row){
    row[field] = e.target.value;
    renderCard();
  }
});

rowsEditor.addEventListener('click', (e) => {
  if(e.target.classList.contains('del-btn')){
    const id = Number(e.target.dataset.id);
    rows = rows.filter(r => r.id !== id);
    renderAll();
  }
});

document.getElementById('addRowBtn').addEventListener('click', () => {
  const nextNum = rows.length + 1;
  rows.push({st:`ST ${nextNum}`, d:'', id: idCounter++});
  renderAll();
  // scroll editor to bottom
  rowsEditor.scrollTop = rowsEditor.scrollHeight;
});

titleInput.addEventListener('input', renderCard);
shiftSelect.addEventListener('change', renderCard);

document.getElementById('exportBtn').addEventListener('click', async () => {
  const btn = document.getElementById('exportBtn');
  btn.disabled = true;
  status.textContent = 'جارِ إنشاء الصورة...';
  try{
    const card = document.getElementById('export-card');
    const canvas = await html2canvas(card, {scale:3, backgroundColor:'#ffffff'});
    const link = document.createElement('a');
    const safeTitle = (titleInput.value.trim() || 'table').replace(/[^a-zA-Z0-9]/g,'_');
    link.download = `${safeTitle}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    status.textContent = 'تم تحميل الصورة ✓';
  }catch(err){
    status.textContent = 'حدث خطأ أثناء إنشاء الصورة';
    console.error(err);
  }
  btn.disabled = false;
  setTimeout(() => status.textContent = '', 3000);
});

renderAll();

// تسجيل الـ Service Worker ليعمل التطبيق بدون إنترنت بعد أول فتحة
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .then(() => console.log('تم تفعيل وضع العمل بدون إنترنت بنجاح'))
      .catch(err => console.warn('تعذر تفعيل وضع بدون إنترنت:', err));
  });
}

// مؤشر حالة الاتصال بالإنترنت
const connStatus = document.getElementById('connStatus');
function updateConnStatus(){
  if(navigator.onLine){
    connStatus.textContent = '🟢 متصل بالإنترنت';
    connStatus.style.color = '#2b8a3e';
  }else{
    connStatus.textContent = '⚪ وضع بدون إنترنت (يعمل من الذاكرة المحلية)';
    connStatus.style.color = '#888';
  }
}
updateConnStatus();
window.addEventListener('online', updateConnStatus);
window.addEventListener('offline', updateConnStatus);
</script>
</body>
</html>
